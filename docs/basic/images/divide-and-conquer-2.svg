<svg xmlns="http://www.w3.org/2000/svg" width="1356" height="678" version="1.1" viewBox="0 0 1356 678"><title>递归与非递归的性能示意</title><desc>按原 Quick Bench 图中的柱高和刻度重绘；柱高仅保留图示精度，并非新的测量结果。</desc><rect width="1356" height="678" fill="#fff"/><g fill="#111" font-family="Times New Roman, serif"><line x1="80" x2="1350" y1="520" y2="520" stroke="#ddd" stroke-width="1.5"/><text x="60" y="528" fill="#666" font-family="Arial, sans-serif" font-size="24" text-anchor="end">0</text><line x1="80" x2="1350" y1="447.714" y2="447.714" stroke="#ddd" stroke-width="1.5"/><text x="60" y="455.714" fill="#666" font-family="Arial, sans-serif" font-size="24" text-anchor="end">1e-6</text><line x1="80" x2="1350" y1="375.429" y2="375.429" stroke="#ddd" stroke-width="1.5"/><text x="60" y="383.429" fill="#666" font-family="Arial, sans-serif" font-size="24" text-anchor="end">2e-6</text><line x1="80" x2="1350" y1="303.143" y2="303.143" stroke="#ddd" stroke-width="1.5"/><text x="60" y="311.143" fill="#666" font-family="Arial, sans-serif" font-size="24" text-anchor="end">3e-6</text><line x1="80" x2="1350" y1="230.857" y2="230.857" stroke="#ddd" stroke-width="1.5"/><text x="60" y="238.857" fill="#666" font-family="Arial, sans-serif" font-size="24" text-anchor="end">4e-6</text><line x1="80" x2="1350" y1="158.571" y2="158.571" stroke="#ddd" stroke-width="1.5"/><text x="60" y="166.571" fill="#666" font-family="Arial, sans-serif" font-size="24" text-anchor="end">5e-6</text><line x1="80" x2="1350" y1="86.286" y2="86.286" stroke="#ddd" stroke-width="1.5"/><text x="60" y="94.286" fill="#666" font-family="Arial, sans-serif" font-size="24" text-anchor="end">6e-6</text><line x1="80" x2="1350" y1="14" y2="14" stroke="#ddd" stroke-width="1.5"/><text x="60" y="22" fill="#666" font-family="Arial, sans-serif" font-size="24" text-anchor="end">7e-6</text><line x1="80" x2="80" y1="14" y2="540" stroke="#aaa" stroke-width="1.5"/><line x1="715" x2="715" y1="14" y2="540" stroke="#ddd" stroke-width="1.5"/><line x1="1350" x2="1350" y1="14" y2="540" stroke="#ddd" stroke-width="1.5"/><rect width="458" height="287" x="168" y="233" fill="#5cd3ca" stroke="none" stroke-width="1"/><rect width="458" height="463" x="803" y="57" fill="#f4b5bf" stroke="none" stroke-width="1"/><text x="397" y="561" fill="#666" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">non_recursion</text><text x="1032" y="561" fill="#666" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">recursion</text><text x="678" y="621" fill="#666" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">ratio (CPU time / Noop time)</text><text x="678" y="650" fill="#666" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">Lower is faster</text></g></svg>